[project]
name = "qagent"
version = "0.1.0"
description = "Multi-Agent Quant Research Copilot — LangGraph-based multi-agent runtime"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "yfinance>=0.2",
    "pandas>=2.0",
    "paramiko>=3.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
web = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]
# GraphRAG 知识库（本地 graphrag 查询），仅启用 QAGENT_GRAPHRAG_ENABLED 时需要
graphrag = ["graphrag"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qagent = ["web/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
