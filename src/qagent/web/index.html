<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QAgent — 量化研究 Copilot</title>
<script src="https://cdn.jsdelivr.net/npm/vue@3.4.21/dist/vue.global.prod.js"></script>
<script>if (!window.Vue) document.write('<script src="https://unpkg.com/vue@3.4.21/dist/vue.global.prod.js"><\/script>');</script>
<style>
  :root {
    --bg: #f4f6f9;
    --sidebar: #16263f;
    --sidebar-ink: #aebdd2;
    --sidebar-active: #ffffff;
    --card: #ffffff;
    --ink: #1f2a37;
    --muted: #7b8794;
    --line: #e4e8ef;
    --blue: #2f6fed;
    --blue-deep: #1e4fbf;
    --blue-soft: #eaf1fe;
    --green: #2e9e5b;
    --red: #d64545;
    --shadow: 0 2px 10px rgba(30, 60, 120, 0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12161c; --card: #1a1f27; --ink: #e6ebf2; --muted: #8a94a3;
      --line: #2a3140; --blue-soft: #1d2b45; --shadow: 0 2px 10px rgba(0,0,0,.4);
      --sidebar: #0e1520; --sidebar-ink: #8ba0bb;
    }
  }

  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--ink); line-height: 1.6; }
  [v-cloak] { display: none; }

  .layout { display: flex; min-height: 100vh; }

  /* ---- 侧边栏 ---- */
  .sidebar {
    width: 210px; flex: none; background: var(--sidebar); color: var(--sidebar-ink);
    display: flex; flex-direction: column; padding: 22px 14px;
    position: sticky; top: 0; height: 100vh;
  }
  .brand { display: flex; align-items: center; gap: 10px; color: #fff; font-size: 17px; font-weight: 650; padding: 0 10px 22px; }
  .brand .logo { width: 30px; height: 30px; border-radius: 8px; background: linear-gradient(135deg, var(--blue), #6ea8ff); display: grid; place-items: center; font-size: 15px; }
  .nav { display: flex; flex-direction: column; gap: 4px; }
  .nav-item {
    display: flex; align-items: center; gap: 11px; padding: 10px 12px; border-radius: 10px;
    cursor: pointer; font-size: 14px; color: var(--sidebar-ink); transition: background .15s, color .15s;
  }
  .nav-item:hover { background: rgba(255,255,255,.06); color: #fff; }
  .nav-item.active { background: rgba(255,255,255,.12); color: #fff; font-weight: 600; }
  .nav-icon { font-size: 16px; width: 20px; text-align: center; }
  .sidebar-foot { margin-top: auto; font-size: 11px; color: #5d7188; padding: 0 10px; }

  /* ---- 主区 ---- */
  .main { flex: 1; padding: 26px 30px 60px; max-width: 1000px; }

  .topbar { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 20px; }
  .topbar h1 { font-size: 22px; margin: 0; font-weight: 680; }
  .topbar p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }

  .status {
    display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; padding: 5px 14px;
    border-radius: 999px; background: var(--card); border: 1px solid var(--line); color: var(--muted);
  }
  .status .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .status.running .pulse, .status.awaiting .pulse { background: var(--blue); animation: blink 1.1s ease-in-out infinite; }
  .status.done .pulse { background: var(--green); }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .3; } }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px 22px; box-shadow: var(--shadow); margin-top: 16px; }
  .card h3 { margin: 0 0 14px; font-size: 13px; font-weight: 650; color: var(--muted); letter-spacing: .5px; }

  textarea {
    width: 100%; min-height: 84px; padding: 14px 16px; font-size: 14px; line-height: 1.6;
    color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 12px;
    resize: vertical; font-family: inherit; outline: none; transition: border-color .2s, box-shadow .2s;
  }
  textarea:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(47,111,237,.14); }

  .btn {
    display: inline-flex; align-items: center; gap: 7px; margin-top: 14px; padding: 10px 24px;
    font-size: 14px; font-weight: 600; border: none; border-radius: 11px; cursor: pointer;
    color: #fff; background: var(--blue); font-family: inherit; transition: filter .15s, transform .08s;
  }
  .btn:hover { filter: brightness(1.06); }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: .5; cursor: not-allowed; filter: none; }
  .btn.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  .btn.green { background: var(--green); }
  .btn.red { background: var(--red); }
  .btn.sm { padding: 7px 16px; font-size: 13px; margin-top: 0; }

  /* ---- 横向工作流 ---- */
  .stepper { display: flex; align-items: flex-start; gap: 6px; flex-wrap: wrap; }
  .step {
    flex: 1; min-width: 78px; text-align: center; padding: 10px 6px 8px; border-radius: 10px;
    cursor: pointer; position: relative; transition: background .15s;
  }
  .step:hover { background: var(--blue-soft); }
  .step-icon { display: block; font-size: 18px; }
  .step-label { display: block; font-size: 12px; margin-top: 4px; color: var(--muted); }
  .step .bar { height: 3px; border-radius: 2px; background: var(--line); margin-top: 8px; }
  .step.done .bar { background: var(--green); }
  .step.current .bar { background: var(--blue); animation: blink 1.1s ease-in-out infinite; }
  .step.done .step-icon { filter: none; }
  .step.pending .step-icon { opacity: .45; }
  .step.done .step-label { color: var(--ink); font-weight: 600; }

  /* ---- 指标卡 ---- */
  .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-top: 16px; }
  .metric {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px 18px; box-shadow: var(--shadow);
  }
  .metric .m-label { font-size: 12px; color: var(--muted); }
  .metric .m-value { font-size: 24px; font-weight: 700; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .m-value.pos { color: var(--green); }
  .m-value.neg { color: var(--red); }

  /* ---- 图表 ---- */
  .legend { display: flex; gap: 16px; float: right; font-size: 12px; color: var(--muted); font-weight: 400; }
  .legend .dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .chart-note { font-size: 11.5px; color: var(--muted); margin-top: 8px; }

  pre {
    white-space: pre-wrap; font-size: 13px; line-height: 1.7; background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin: 0; overflow-x: auto;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; color: var(--ink);
  }

  /* ---- 节点详情 ---- */
  .detail { margin-top: 12px; font-size: 13px; }
  .detail .call { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--line); }
  .detail .call:last-child { border-bottom: none; }
  .detail .tool { font-family: ui-monospace, monospace; color: var(--blue-deep); font-weight: 600; min-width: 160px; }
  .detail .meta { color: var(--muted); font-size: 12px; }

  .table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .table th, .table td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); }
  .table th { color: var(--muted); font-weight: 600; font-size: 12px; }
  .muted { color: var(--muted); }
  .empty { color: var(--muted); font-size: 13px; padding: 10px 0; }
</style>
</head>
<body>
<div id="app" v-cloak>
  <div class="layout">

    <!-- 侧边栏 -->
    <aside class="sidebar">
      <div class="brand"><span class="logo">◈</span> QAgent</div>
      <nav class="nav">
        <div class="nav-item" v-for="n in navItems" :key="n.key"
             :class="{ active: activeNav === n.key }" @click="switchNav(n.key)">
          <span class="nav-icon">{{ n.icon }}</span>{{ n.label }}
        </div>
      </nav>
      <div class="sidebar-foot">v0.1 · LangGraph<br>Multi-Agent Quant Copilot</div>
    </aside>

    <!-- 主工作区 -->
    <main class="main">

      <!-- 顶栏 -->
      <header class="topbar">
        <div>
          <h1>量化研究 Copilot</h1>
          <p>欢迎回来，今天想研究什么策略？</p>
        </div>
        <span class="status" :class="phase"><span class="pulse"></span>{{ statusText }}</span>
      </header>

      <!-- 首页：任务区 -->
      <template v-if="activeNav === 'home'">
        <section class="card">
          <h3>研究指令</h3>
          <textarea v-model="query" placeholder="例如：研究 AAPL、MSFT、NVDA 在 2024-01-01 到 2024-12-31 的 20 日动量并回测"></textarea>
          <div style="margin-top:10px">
            <label style="font-size:13px;color:var(--muted);cursor:pointer">
              <input type="checkbox" v-model="demo" style="vertical-align:-2px;margin-right:6px">演示数据（合成行情，离线可看收益曲线）
            </label>
          </div>
          <button class="btn" @click="run" :disabled="running">{{ running ? '运行中…' : '▶ 运行' }}</button>
          <button class="btn ghost" v-if="nodes.length && !running" @click="reset">清空</button>
        </section>

        <!-- 工作流 -->
        <section class="card" v-if="nodes.length">
          <h3>Agent 工作流</h3>
          <div class="stepper">
            <div class="step" v-for="s in workflow" :key="s.key"
                 :class="stepState(s.key)" @click="showNode(s.key)">
              <span class="step-icon">{{ s.icon }}</span>
              <span class="step-label">{{ s.label }}</span>
              <div class="bar"></div>
            </div>
          </div>
          <div class="detail" v-if="detailKey">
            <div v-for="c in detailCalls" :key="c.tool" class="call">
              <span class="tool">{{ c.tool }}</span>
              <span class="meta">{{ c.status }} · {{ c.duration_ms }}ms · {{ c.output_summary }}</span>
            </div>
            <div class="muted" v-if="!detailCalls.length">该节点无工具调用</div>
          </div>
        </section>

        <!-- 人工确认 -->
        <section class="card" v-if="awaiting" style="border-color: var(--blue); box-shadow: 0 0 0 3px rgba(47,111,237,.10)">
          <h3>策略确认 · 请审核后继续</h3>
          <pre>{{ prettyConfig }}</pre>
          <div style="margin-top:14px">
            <button class="btn green" @click="confirm('approve')">✓ 同意</button>
            <button class="btn" @click="confirm('modify')">✎ 修改（top_n=2）</button>
            <button class="btn red" @click="confirm('reject')">✕ 拒绝</button>
          </div>
        </section>

        <!-- 指标卡 -->
        <section class="metrics" v-if="metrics">
          <div class="metric" v-for="m in metricCards" :key="m.label">
            <div class="m-label">{{ m.label }}</div>
            <div class="m-value" :class="m.cls">{{ m.value }}</div>
          </div>
        </section>

        <!-- 审计 & 核查 -->
        <section class="card" v-if="riskLevel || factCheck">
          <div style="display:flex; gap:28px; align-items:center; flex-wrap:wrap">
            <div>
              <div class="muted" style="font-size:12px">🛡️ 风险审计</div>
              <div style="font-size:20px;font-weight:700;margin-top:4px"
                   :style="riskLevel==='low' ? 'color:var(--green)' : riskLevel==='high' ? 'color:var(--red)' : 'color:var(--blue)'">
                {{ riskLevel || '—' }}
              </div>
            </div>
            <div style="width:1px;height:36px;background:var(--line)"></div>
            <div>
              <div class="muted" style="font-size:12px">✅ 事实核查</div>
              <div style="font-size:16px;font-weight:650;margin-top:7px">
                {{ factCheck ? factCheck.claims_checked + ' 项' : '—' }}
                <span :style="factCheck && factCheck.mismatches.length ? 'color:var(--red)' : 'color:var(--green)'">
                  {{ factCheck && factCheck.mismatches.length ? factCheck.mismatches.length + ' 项不符' : '全部通过' }}
                </span>
              </div>
            </div>
          </div>
        </section>

        <!-- 收益曲线 -->
        <section class="card" v-if="chart">
          <h3>组合累计收益曲线（等权）
            <span class="legend">
              <span v-for="st in chart.stockLines" :key="st.symbol"><span class="dot" :style="'background:'+st.color"></span>{{ st.symbol }}</span>
              <span><span class="dot" style="background:#1e4fbf"></span>策略组合</span>
              <span><span class="dot" style="background:#9aa4b2"></span>基准</span>
            </span>
          </h3>
          <svg :viewBox="chart.vb" style="width:100%;height:auto">
            <line v-for="g in chart.grid" :key="g" :x1="0" :x2="chart.w" :y1="g" :y2="g" stroke="#e4e8ef" stroke-width="1"/>
            <polyline v-for="st in chart.stockLines" :key="st.symbol" :points="st.points" fill="none" :stroke="st.color" stroke-width="1.6" opacity="0.85"/>
            <polyline :points="chart.benchPoints" fill="none" stroke="#9aa4b2" stroke-width="2" stroke-dasharray="5,4"/>
            <polyline :points="chart.cumPoints" fill="none" stroke="#1e4fbf" stroke-width="3"/>
          </svg>
          <p class="chart-note">选股：{{ (selected || []).join('、') }}（等权组合）。细线为个股，粗蓝线为组合，灰虚线为全池等权基准。</p>
          <h3 style="margin-top:18px">回撤曲线（组合）</h3>
          <svg :viewBox="'0 0 ' + chart.w + ' 90'" style="width:100%;height:auto">
            <polygon :points="chart.ddArea" fill="rgba(214,69,69,.18)"/>
            <polyline :points="chart.ddPoints" fill="none" stroke="#d64545" stroke-width="2"/>
          </svg>
          <p class="chart-note">曲线取自实际回测的组合日收益（信号窗/持有窗分离、t+1 开盘执行）{{ demo ? '；行情为合成演示数据' : '；行情来自真实数据源' }}。</p>
        </section>

        <!-- 最终报告 -->
        <section class="card" v-if="report">
          <h3>最终报告</h3>
          <pre>{{ report }}</pre>
        </section>
      </template>

      <!-- 历史记录 -->
      <template v-if="activeNav === 'history'">
        <section class="card">
          <h3>实验记录（SQLite ResultStore）</h3>
          <button class="btn sm" @click="loadHistory">刷新</button>
          <table class="table" v-if="experiments.length">
            <thead><tr><th>ref</th><th>年化收益</th><th>夏普</th><th>最大回撤</th><th>选股</th><th>时间</th></tr></thead>
            <tbody>
              <tr v-for="e in experiments" :key="e.ref">
                <td class="tool">{{ e.ref }}</td>
                <td>{{ fmtPct(e.metrics && e.metrics.annual_return) }}</td>
                <td>{{ (e.metrics && e.metrics.sharpe || 0).toFixed(2) }}</td>
                <td>{{ fmtPct(e.metrics && e.metrics.max_drawdown) }}</td>
                <td>{{ (e.selected || []).join(', ') }}</td>
                <td class="muted">{{ (e.created_at || '').slice(0, 19) }}</td>
              </tr>
            </tbody>
          </table>
          <div class="empty" v-else>暂无实验记录，先回首页跑一次回测。</div>
        </section>
      </template>

      <!-- 占位页 -->
      <template v-if="activeNav === 'library' || activeNav === 'settings'">
        <section class="card">
          <h3>{{ activeNav === 'library' ? '策略库' : '设置' }}</h3>
          <div class="empty">该模块为占位页，后续接入。</div>
        </section>
      </template>

    </main>
  </div>
</div>

<script>
if (!window.Vue) {
  const el = document.getElementById('app'); el.removeAttribute('v-cloak');
  el.innerHTML = '<div class="card"><h3>前端加载失败</h3><pre>Vue 未能从 CDN 加载（需浏览器联网），请刷新重试。</pre></div>';
} else {
const { createApp } = Vue;

const WORKFLOW = [
  { key: 'planner', label: '规划', icon: '🧭' },
  { key: 'research', label: '研究', icon: '🔍' },
  { key: 'quant', label: '量化', icon: '📊' },
  { key: 'human_confirm', label: '确认', icon: '👤' },
  { key: 'risk', label: '审计', icon: '🛡️' },
  { key: 'fact_check', label: '核查', icon: '✅' },
  { key: 'report', label: '报告', icon: '📝' },
];

function toPoints(values, w, h, min, max) {
  if (!values || values.length < 2) return '';
  const n = values.length, pad = 6;
  const span = (max - min) || 1;
  const x = i => pad + (i / (n - 1)) * (w - 2 * pad);
  const y = v => h - pad - ((v - min) / span) * (h - 2 * pad);
  return values.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
}

const STOCK_COLORS = ['#e8a33d', '#5aa9a0', '#b06ab3', '#6b8ac9', '#c9705e', '#7ba05b'];

createApp({
  data() {
    return {
      activeNav: 'home',
      navItems: [
        { key: 'home', label: '首页', icon: '🏠' },
        { key: 'history', label: '历史记录', icon: '🕘' },
        { key: 'library', label: '策略库', icon: '📚' },
        { key: 'settings', label: '设置', icon: '⚙️' },
      ],
      query: '研究 AAPL、MSFT、NVDA 在 2024-01-01 到 2024-12-31 的 20 日动量并回测',
      demo: true,
      workflow: WORKFLOW,
      nodes: [], running: false, awaiting: false, config: {}, taskId: null,
      report: '', metrics: null, series: null, selected: [],
      riskLevel: null, factCheck: null,
      traceMap: {}, detailKey: null, phase: 'idle', experiments: []
    };
  },
  computed: {
    prettyConfig() { return JSON.stringify(this.config, null, 2); },
    statusText() {
      if (this.running) return '运行中';
      if (this.awaiting) return '等待人工确认';
      if (this.report) return '完成';
      return '就绪';
    },
    metricCards() {
      const m = this.metrics || {};
      const cls = v => (v == null ? '' : (v >= 0 ? 'pos' : 'neg'));
      return [
        { label: '年化收益', value: this.fmtPct(m.annual_return), cls: cls(m.annual_return) },
        { label: '总收益', value: this.fmtPct(m.total_return), cls: cls(m.total_return) },
        { label: '夏普比率', value: (m.sharpe == null ? '—' : Number(m.sharpe).toFixed(2)), cls: '' },
        { label: '最大回撤', value: this.fmtPct(m.max_drawdown), cls: 'neg' },
      ];
    },
    chart() {
      const s = this.series;
      if (!s || !s.cumulative || s.cumulative.length < 2) return null;
      const w = 640, h = 240;
      const bench = s.benchmark && s.benchmark.length ? s.benchmark : s.cumulative;
      const stocks = (s.stocks || []).filter(st => st.cumulative && st.cumulative.length >= 2);
      const all = s.cumulative.concat(bench);
      stocks.forEach(st => { for (const v of st.cumulative) all.push(v); });
      const min = Math.min.apply(null, all), max = Math.max.apply(null, all);
      const dd = s.drawdown && s.drawdown.length ? s.drawdown : [0];
      const ddMax = Math.max.apply(null, dd.concat([0])) || 0.0001;
      const ddH = 90;
      const ddPoints = toPoints(dd, w, ddH, 0, ddMax);
      const base = ddH - 6;
      return {
        w, vb: `0 0 ${w} ${h}`,
        cumPoints: toPoints(s.cumulative, w, h, min, max),
        benchPoints: toPoints(bench, w, h, min, max),
        stockLines: stocks.map((st, i) => ({
          symbol: st.symbol,
          points: toPoints(st.cumulative, w, h, min, max),
          color: STOCK_COLORS[i % STOCK_COLORS.length],
        })),
        ddPoints,
        ddArea: `${ddPoints} ${w - 6},${base} 6,${base}`,
        grid: [h * 0.25, h * 0.5, h * 0.75].map(x => x.toFixed(0)),
      };
    },
    detailCalls() {
      const t = this.traceMap[this.detailKey];
      return t ? t.tool_calls || [] : [];
    },
  },
  methods: {
    fmtPct(v) { return v == null ? '—' : (v * 100).toFixed(2) + '%'; },
    switchNav(key) { this.activeNav = key; if (key === 'history') this.loadHistory(); },
    reset() {
      this.nodes = []; this.awaiting = false; this.config = {}; this.report = '';
      this.metrics = null; this.series = null; this.traceMap = {}; this.detailKey = null;
      this.phase = 'idle';
    },
    stepState(key) {
      const done = this.nodes.some(n => n.key === key);
      if (done) return 'done';
      if (this.awaiting && key === 'human_confirm') return 'current';
      if (this.running && this.nodes.length && key === this.nodes[this.nodes.length - 1].key) return 'current';
      return 'pending';
    },
    showNode(key) { this.detailKey = this.detailKey === key ? null : key; },
    run() {
      this.reset(); this.running = true; this.phase = 'running';
      const es = new EventSource(`/api/run-stream?query=${encodeURIComponent(this.query)}&demo=${this.demo ? 1 : 0}`);
      es.addEventListener('node', e => {
        const key = JSON.parse(e.data).node;
        const meta = WORKFLOW.find(w => w.key === key) || { label: key, icon: '•' };
        if (!this.nodes.some(n => n.key === key)) this.nodes.push({ key, label: meta.label, icon: meta.icon });
      });
      es.addEventListener('interrupt', e => {
        const d = JSON.parse(e.data);
        this.taskId = d.task_id;
        this.config = d.strategy_config || {};
        this.awaiting = true; this.running = false; this.phase = 'awaiting';
        es.close();
      });
      es.addEventListener('done', e => {
        const d = JSON.parse(e.data);
        this.report = d.final_report || `(status=${d.status})`;
        this.running = false; this.phase = 'done';
        es.close();
      });
      es.onerror = () => { this.running = false; if (!this.awaiting && !this.report) this.phase = 'idle'; es.close(); };
    },
    async confirm(action) {
      const body = { task_id: this.taskId, action, demo: this.demo };
      if (action === 'modify') body.config = { top_n: 2 };
      this.awaiting = false; this.running = true; this.phase = 'running';
      const r = await fetch('/api/confirm', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      const s = await r.json();
      this.running = false;
      this.report = s.final_report || `(status=${s.status})`;
      this.metrics = s.metrics || null;
      this.series = s.series || null;
      this.selected = s.selected || [];
      this.riskLevel = (s.risk_report && s.risk_report.level) || null;
      this.factCheck = s.fact_check_result || null;
      // 从最终 trace 重建已完成节点：审计/核查/报告在 confirm 后才跑完，SSE 推不到
      this.traceMap = {};
      const completed = [], seen = new Set();
      (s.trace || []).forEach(t => {
        const key = t.node.replace(/_node$/, '');
        this.traceMap[key] = t;
        const meta = WORKFLOW.find(w => w.key === key);
        if (meta && !seen.has(key)) { seen.add(key); completed.push({ key, label: meta.label, icon: meta.icon }); }
      });
      this.nodes = completed;
      this.phase = 'done';
    },
    async loadHistory() {
      try {
        const r = await fetch('/api/experiments');
        this.experiments = await r.json();
      } catch (e) { this.experiments = []; }
    },
  },
}).mount('#app');
}
</script>
</body>
</html>
